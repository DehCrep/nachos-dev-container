name: Create Release and Publish Docker Image

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: write    # Required to create GitHub Releases and upload assets
  packages: write    # Required to publish images to GHCR

jobs:
  release-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Generate clean release tags and lowercase owner/repo strings
      - name: Generate Tag Name & Lowercase Names
        id: tag
        run: |
          # Use UTC date formatting to avoid shell escaping issues
          DATE_STAMP=$(date -u +%Y.%m.%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="v${DATE_STAMP}-${SHORT_SHA}"
          
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "OWNER_LOWER=${OWNER_LOWER}" >> $GITHUB_ENV
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "Generated tag: ${TAG_NAME} for ghcr.io/${OWNER_LOWER}/${REPO_LOWER}"

      # 2. Update devcontainer.json image tag to match the release version
      - name: Update devcontainer.json image tag
        run: |
          IMAGE_URI="ghcr.io/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}:${{ env.RELEASE_TAG }}"
          echo "Updating devcontainer.json to use image: $IMAGE_URI"
          sed -i -E 's|("image":\s*")[^"]*(")|\1'"$IMAGE_URI"'\2|g' .devcontainer/devcontainer.json

      # 3. Archive both .devcontainer and .vscode folders into environment.zip
      - name: Archive .devcontainer and .vscode folders
        run: |
          zip -r environment.zip .devcontainer .vscode
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate with GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and push multi-arch Docker image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}:${{ github.ref_name == 'main' && env.RELEASE_TAG || 'dev' }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/{1}:latest', env.OWNER_LOWER, env.REPO_LOWER) || '' }}


      # 6. Create GitHub Release and attach environment.zip (Runs ONLY on main)
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          body: |
            ## Automated Release
            - **Commit:** `${{ github.sha }}`
            - **Docker Image:** `ghcr.io/${{ env.OWNER_LOWER }}/${{ env.REPO_LOWER }}:${{ env.RELEASE_TAG }}`
            
            ### Quick Start
            1. Download `environment.zip` from the assets below.
            2. Extract `.devcontainer/` and `.vscode/` into the root of your Nachos source tree.
            3. Open the workspace folder in VS Code and select **Reopen in Container**.
          files: |
            environment.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}