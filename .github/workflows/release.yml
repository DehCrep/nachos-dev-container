name: Create Release and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Prevent two runs for the same branch from racing over
# latest/dev tags or creating duplicate releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Generate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          DATE_STAMP="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_TAG="v${DATE_STAMP}-${SHORT_SHA}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Docker image: ${IMAGE}"

      - name: Update devcontainer image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          FILE=".devcontainer/devcontainer.json"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::${FILE} does not exist"
            exit 1
          fi

          IMAGE_URI="${IMAGE}:${RELEASE_TAG}"

          echo "Updating ${FILE}:"
          echo "  image = ${IMAGE_URI}"

          # Requires the JSON file to contain an "image" property.
          sed -i -E \
            's|("image"[[:space:]]*:[[:space:]]*")[^"]*(")|\1'"${IMAGE_URI}"'\2|' \
            "$FILE"

          if ! grep -qF "\"image\": \"${IMAGE_URI}\"" "$FILE"; then
            echo "::error::Failed to update image in ${FILE}"
            exit 1
          fi

      - name: Create environment archive
        shell: bash
        run: |
          set -euo pipefail

          [[ -d .devcontainer ]] || {
            echo "::error::.devcontainer directory is missing"
            exit 1
          }

          rm -f environment.zip

          if [[ -d .vscode ]]; then
            zip -r -q environment.zip .devcontainer .vscode
          else
            echo "::warning::.vscode directory is missing; archiving .devcontainer only"
            zip -r -q environment.zip .devcontainer
          fi

          unzip -l environment.zip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.release_tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Generate release archive
        shell: bash
        run: |
          set -euo pipefail

          [[ -d .devcontainer ]] || {
            echo "::error::.devcontainer directory is missing"
            exit 1
          }

          rm -f environment.zip

          if [[ -d .vscode ]]; then
            zip -r -q environment.zip .devcontainer .vscode
          else
            echo "::warning::.vscode directory is missing; archiving .devcontainer only"
            zip -r -q environment.zip .devcontainer
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish.outputs.release_tag }}
          name: Release ${{ needs.build-and-publish.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Automated Release

            - **Commit:** `${{ github.sha }}`
            - **Docker Image:** `${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.release_tag }}`

            ### Quick Start

            1. Download `environment.zip` from the assets below.
            2. Extract `.devcontainer/` and `.vscode/` into the root of your source tree.
            3. Open the workspace folder in VS Code.
            4. Select **Reopen in Container**.

          files: environment.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}